name: Release

on:
  push:
    branches: ["main"]

# Only one release pipeline at a time
concurrency:
  group: release
  cancel-in-progress: false

env:
  GO_VERSION: "1.27.0"
  BUN_VERSION: "1.2"
  REGISTRY: docker.io
  IMAGE_BASE: omarmohamed04/moneyflow
  IMAGE_BACKEND: omarmohamed04/moneyflow
  IMAGE_FRONTEND: omarmohamed04/moneyflow

jobs:
  # ──────────────────────────────────────────────────────────
  # Build, tag, scan, sign, and push both images once.
  # All downstream jobs reference the immutable digest.
  # ──────────────────────────────────────────────────────────
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write     # for OIDC / cosign

    outputs:
      backend-digest:  ${{ steps.push-backend.outputs.digest }}
      frontend-digest: ${{ steps.push-frontend.outputs.digest }}
      git-sha:         ${{ github.sha }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      # ── Backend ──────────────────────────────────────────
      - name: Build and push backend image
        id: push-backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}:api-${{ github.sha }}
            ${{ env.IMAGE_BASE }}:api-latest
            ${{ env.IMAGE_BASE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ github.sha }}
            GIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ github.event.head_commit.timestamp }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}

      - name: Generate SBOM (backend)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE_BASE }}@${{ steps.push-backend.outputs.digest }}
          artifact-name: sbom-backend-${{ github.sha }}.spdx

      - name: Scan backend image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_BASE }}@${{ steps.push-backend.outputs.digest }}
          format: sarif
          output: trivy-backend.sarif
          exit-code: "1"
          ignore-unfixed: true
          severity: "CRITICAL,HIGH"

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-backend.sarif
          category: trivy-backend

      - name: Sign backend image
        run: |
          cosign sign --yes \
            ${{ env.IMAGE_BASE }}@${{ steps.push-backend.outputs.digest }}

      # ── Frontend ─────────────────────────────────────────
      - name: Build and push frontend image
        id: push-frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.frontend
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}:frontend-${{ github.sha }}
            ${{ env.IMAGE_BASE }}:frontend-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}

      - name: Sign frontend image
        run: |
          cosign sign --yes \
            ${{ env.IMAGE_BASE }}@${{ steps.push-frontend.outputs.digest }}

  # ──────────────────────────────────────────────────────────
  # Deploy to staging using the exact immutable digests above
  # ──────────────────────────────────────────────────────────
  deploy-staging:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      id-token: write
      contents: read

    env:
      BACKEND_IMAGE:  ${{ env.IMAGE_BASE }}@${{ needs.build-and-push.outputs.backend-digest }}
      FRONTEND_IMAGE: ${{ env.IMAGE_BASE }}@${{ needs.build-and-push.outputs.frontend-digest }}

    steps:
      - uses: actions/checkout@v4

      - name: Install kustomize
        run: |
          curl -sSfL "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" \
            | bash -s -- /usr/local/bin

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      # Replace this step with your cloud provider's OIDC auth action
      # e.g. google-github-actions/auth for GKE, aws-actions/configure-aws-credentials for EKS
      - name: Configure kubeconfig (staging)
        run: echo "${{ secrets.KUBE_CONFIG_STAGING }}" | base64 -d > $HOME/.kube/config

      - name: Set image tags in staging overlay
        run: |
          cd deploy/k8s/overlays/staging
          kustomize edit set image \
            moneyflow-api="${{ env.BACKEND_IMAGE }}" \
            moneyflow-worker="${{ env.BACKEND_IMAGE }}" \
            moneyflow-frontend="${{ env.FRONTEND_IMAGE }}"

      - name: Run database migration (staging)
        run: |
          # Patch migrate Job image and apply
          kubectl create job migrate-${{ github.sha }} \
            --from=cronjob/moneyflow-migrate \
            --namespace=moneyflow-staging \
            --dry-run=client -o yaml \
          | kubectl set image -f - \
            migrate="${{ env.BACKEND_IMAGE }}" \
          | kubectl apply -f -

          # Wait for migration to complete
          kubectl wait --for=condition=complete \
            job/migrate-${{ github.sha }} \
            --namespace=moneyflow-staging \
            --timeout=120s

      - name: Apply staging manifests
        run: |
          kustomize build deploy/k8s/overlays/staging \
            | kubectl apply -f -

      - name: Wait for rollout (API)
        run: |
          kubectl rollout status deployment/moneyflow-api \
            --namespace=moneyflow-staging \
            --timeout=300s

      - name: Wait for rollout (worker)
        run: |
          kubectl rollout status deployment/moneyflow-worker \
            --namespace=moneyflow-staging \
            --timeout=180s

      - name: Wait for rollout (frontend)
        run: |
          kubectl rollout status deployment/moneyflow-frontend \
            --namespace=moneyflow-staging \
            --timeout=180s

      - name: Smoke test staging health endpoint
        run: |
          STAGING_URL="${{ secrets.STAGING_API_URL }}"
          for i in $(seq 1 10); do
            STATUS=$(curl -sf -o /dev/null -w "%{http_code}" "${STAGING_URL}/health")
            if [ "$STATUS" = "200" ]; then
              echo "Health check passed (HTTP $STATUS)"
              exit 0
            fi
            echo "Attempt $i: HTTP $STATUS — retrying..."
            sleep 10
          done
          echo "Staging health check failed after 10 attempts"
          exit 1

      - name: Publish deployment summary
        run: |
          echo "## Staging Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Git SHA** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Backend digest** | \`${{ needs.build-and-push.outputs.backend-digest }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Frontend digest** | \`${{ needs.build-and-push.outputs.frontend-digest }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Environment** | staging |" >> $GITHUB_STEP_SUMMARY
