name: CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

# Cancel superseded runs on the same branch
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.27.0"
  BUN_VERSION: "1.2"
  REGISTRY: docker.io
  IMAGE_NAME: omarmohamed04/moneyflow

jobs:
  # ──────────────────────────────────────────────────────────
  # Detect changed paths so we run only what changed
  # ──────────────────────────────────────────────────────────
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend:  ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      infra:    ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'apps/backend/**'
              - 'Dockerfile'
              - 'go.*'
            frontend:
              - 'apps/frontend/**'
              - 'packages/**'
              - 'Dockerfile.frontend'
            infra:
              - 'deploy/**'
              - 'docker-compose*.yml'
              - '.github/workflows/**'

  # ──────────────────────────────────────────────────────────
  # Backend: lint, format, vet, test (with race detector)
  # ──────────────────────────────────────────────────────────
  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: apps/backend/go.sum

      - name: go vet
        run: go vet ./...

      - name: gofmt check
        run: |
          FILES=$(gofmt -l .)
          if [ -n "$FILES" ]; then
            echo "Unformatted files:"
            echo "$FILES"
            exit 1
          fi

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: apps/backend

      # Start test dependencies
      - name: Start test infrastructure
        run: |
          docker compose -f ../../docker-compose.test.yml up -d
          # Wait for health checks
          docker compose -f ../../docker-compose.test.yml ps
        working-directory: apps/backend

      - name: Wait for Postgres and Redis
        run: |
          for i in $(seq 1 30); do
            if docker compose -f docker-compose.test.yml ps | grep -q "healthy"; then
              echo "Dependencies healthy"
              break
            fi
            echo "Waiting for dependencies... ($i/30)"
            sleep 2
          done

      - name: go test (unit + integration, race detector)
        run: go test -race -count=1 -timeout=120s ./...
        env:
          TEST_POSTGRES_HOST: localhost
          TEST_POSTGRES_PORT: 5433
          TEST_POSTGRES_USER: moneyflow_test
          TEST_POSTGRES_PASSWORD: moneyflow_test
          TEST_POSTGRES_DB: moneyflow_test
          TEST_REDIS_ADDR: localhost:6380
          TESTCONTAINERS_RYUK_DISABLED: "true"  # use our Compose stack instead

      - name: Collect test infrastructure logs on failure
        if: failure()
        run: docker compose -f docker-compose.test.yml logs

      - name: Tear down test infrastructure
        if: always()
        run: docker compose -f docker-compose.test.yml down -v

  # ──────────────────────────────────────────────────────────
  # Frontend: lint, typecheck, build
  # ──────────────────────────────────────────────────────────
  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build shared packages
        run: bun nx run-many -t build -p openapi zod --if-present

      - name: nx affected — lint, typecheck, build
        run: bun nx affected -t lint typecheck build --base=origin/main

  # ──────────────────────────────────────────────────────────
  # Docker: build and smoke-test images
  # ──────────────────────────────────────────────────────────
  docker-build:
    needs: [backend, frontend]
    if: |
      always() &&
      (needs.backend.result == 'success' || needs.backend.result == 'skipped') &&
      (needs.frontend.result == 'success' || needs.frontend.result == 'skipped')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          tags: ${{ env.IMAGE_NAME }}:api-ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=ci
            GIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ github.event.head_commit.timestamp }}

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.frontend
          push: false
          tags: ${{ env.IMAGE_NAME }}:frontend-ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test backend image (health endpoint)
        run: |
          # Start backend with minimal env (it will fail to connect to DB but /health should start)
          docker run -d --name api-smoke \
            -p 8081:8080 \
            -e MONEYFLOW_PRIMARY.ENV=local \
            -e MONEYFLOW_SERVER.PORT=8080 \
            -e MONEYFLOW_SERVER.READ_TIMEOUT=30 \
            -e MONEYFLOW_SERVER.WRITE_TIMEOUT=30 \
            -e MONEYFLOW_SERVER.IDLE_TIMEOUT=60 \
            -e "MONEYFLOW_SERVER.CORS_ALLOWED_ORIGINS=http://localhost:5173" \
            -e MONEYFLOW_DATABASE.HOST=localhost \
            -e MONEYFLOW_DATABASE.PORT=5432 \
            -e MONEYFLOW_DATABASE.USER=moneyflow \
            -e MONEYFLOW_DATABASE.PASSWORD=moneyflow \
            -e MONEYFLOW_DATABASE.NAME=moneyflow \
            -e MONEYFLOW_DATABASE.SSL_MODE=disable \
            -e MONEYFLOW_DATABASE.MAX_OPEN_CONNS=5 \
            -e MONEYFLOW_DATABASE.MAX_IDLE_CONNS=5 \
            -e MONEYFLOW_DATABASE.CONN_MAX_LIFETIME=60 \
            -e MONEYFLOW_DATABASE.CONN_MAX_IDLE_TIME=60 \
            -e MONEYFLOW_REDIS.ADDRESS=localhost:6379 \
            -e MONEYFLOW_AUTH.SECRET_KEY=ci-test-key \
            -e MONEYFLOW_INTEGRATION.RESEND_API_KEY=re_test \
            ${{ env.IMAGE_NAME }}:api-ci-${{ github.sha }} || true
          sleep 5
          docker logs api-smoke || true
          docker stop api-smoke || true
          docker rm api-smoke || true

      - name: Scan backend image for vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}:api-ci-${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"

  # ──────────────────────────────────────────────────────────
  # Kubernetes manifest validation
  # ──────────────────────────────────────────────────────────
  k8s-validate:
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install kubeconform
        run: |
          curl -sSfL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz \
            | tar -xz -C /usr/local/bin

      - name: Install kustomize
        run: |
          curl -sSfL "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" \
            | bash -s -- /usr/local/bin

      - name: Validate base manifests
        run: |
          kustomize build deploy/k8s/base | kubeconform \
            -strict \
            -summary \
            -kubernetes-version 1.30.0

      - name: Validate staging overlay
        run: |
          kustomize build deploy/k8s/overlays/staging | kubeconform \
            -strict \
            -summary \
            -kubernetes-version 1.30.0

      - name: Validate production overlay
        run: |
          kustomize build deploy/k8s/overlays/production | kubeconform \
            -strict \
            -summary \
            -kubernetes-version 1.30.0
