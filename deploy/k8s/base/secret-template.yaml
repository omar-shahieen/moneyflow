apiVersion: v1
kind: Secret
metadata:
  name: moneyflow-secrets
  namespace: moneyflow   # patched to moneyflow-staging / moneyflow-production by overlays
  labels:
    app.kubernetes.io/name: moneyflow
type: Opaque
# ─────────────────────────────────────────────────────────────────────────────
# DO NOT COMMIT real values. This file is a documentation template only.
#
# Create this Secret in each namespace before deploying:
#
#   kubectl create secret generic moneyflow-secrets \
#     --namespace=moneyflow-<env> \
#     --from-literal=MONEYFLOW_DATABASE.PASSWORD=<db-password> \
#     --from-literal=MONEYFLOW_AUTH.SECRET_KEY=<jwt-secret> \
#     --from-literal=MONEYFLOW_INTEGRATION.RESEND_API_KEY=<resend-api-key> \
#     --from-literal=MONEYFLOW_BILLING.PROVIDER=fawry \
#     --from-literal=MONEYFLOW_BILLING.MERCHANT_CODE=<fawry-merchant-code> \
#     --from-literal=MONEYFLOW_BILLING.SECURE_KEY=<fawry-secure-key> \
#     --from-literal=MONEYFLOW_BILLING.BASE_URL=https://atfawry.com \
#     --from-literal=MONEYFLOW_BILLING.WEBHOOK_SECRET=<webhook-secret> \
#     --from-literal=MONEYFLOW_BILLING.SUCCESS_RETURN_URL=https://moneyflow.example.com/billing/success \
#     --from-literal=MONEYFLOW_BILLING.CANCEL_RETURN_URL=https://moneyflow.example.com/billing/cancel \
#     --from-literal=MONEYFLOW_BILLING.WEBHOOK_URL=https://moneyflow.example.com/api/v1/billing/webhook \
#     --from-literal=MONEYFLOW_BILLING.PLAN_PRICES.PRO=9.99 \
#     --from-literal=MONEYFLOW_BILLING.PLAN_PRICES.VIP=19.99 \
#     --from-literal=MONEYFLOW_BILLING.CHARGE_EXPIRY_MINUTES=30 \
#     --from-literal=MONEYFLOW_BILLING.DUNNING_GRACE_DAYS=3 \
#     --from-literal=MONEYFLOW_BILLING.DUNNING_MAX_RETRIES=3 \
#     --from-literal=MONEYFLOW_BILLING.DUNNING_RETRY_INTERVAL_HOURS=24 \
#     --from-literal=MONEYFLOW_OBSERVABILITY.NEW_RELIC.LICENSE_KEY=<new-relic-license-key> \
#     --from-literal=MONEYFLOW_STORAGE.PROVIDER=r2 \
#     --from-literal=MONEYFLOW_STORAGE.R2.ACCOUNT_ID=<r2-account-id> \
#     --from-literal=MONEYFLOW_STORAGE.R2.ACCESS_KEY_ID=<r2-access-key-id> \
#     --from-literal=MONEYFLOW_STORAGE.R2.SECRET_ACCESS_KEY=<r2-secret-access-key> \
#     --from-literal=MONEYFLOW_STORAGE.R2.BUCKET_NAME=<r2-bucket-name> \
#     --from-literal=MONEYFLOW_STORAGE.R2.PUBLIC_URL=<r2-public-url>
#
# Alternatively, use ExternalSecrets with your preferred secrets manager
# (AWS Secrets Manager, HashiCorp Vault, GCP Secret Manager, etc.)
# ─────────────────────────────────────────────────────────────────────────────
#
# Required keys (config struct validates these as required):
#   MONEYFLOW_DATABASE.PASSWORD          — postgres password
#   MONEYFLOW_AUTH.SECRET_KEY            — JWT signing secret (min 32 chars recommended)
#   MONEYFLOW_INTEGRATION.RESEND_API_KEY — Resend email API key
#   MONEYFLOW_BILLING.PROVIDER           — "fawry"
#   MONEYFLOW_BILLING.MERCHANT_CODE      — Fawry merchant code
#   MONEYFLOW_BILLING.SECURE_KEY         — Fawry secure hash key
#   MONEYFLOW_BILLING.BASE_URL           — Fawry API base URL
#   MONEYFLOW_BILLING.WEBHOOK_SECRET     — Fawry webhook signature secret
#   MONEYFLOW_BILLING.SUCCESS_RETURN_URL — Post-payment success redirect URL
#   MONEYFLOW_BILLING.CANCEL_RETURN_URL  — Post-payment cancel redirect URL
#   MONEYFLOW_BILLING.WEBHOOK_URL        — Your public webhook endpoint URL
#   MONEYFLOW_BILLING.PLAN_PRICES.PRO    — float, e.g. "9.99"
#   MONEYFLOW_BILLING.PLAN_PRICES.VIP    — float, e.g. "19.99"
#   MONEYFLOW_BILLING.CHARGE_EXPIRY_MINUTES    — int, e.g. "30"
#   MONEYFLOW_BILLING.DUNNING_GRACE_DAYS       — int, e.g. "3"
#   MONEYFLOW_BILLING.DUNNING_MAX_RETRIES      — int, e.g. "3"
#   MONEYFLOW_BILLING.DUNNING_RETRY_INTERVAL_HOURS — int, e.g. "24"
#
# Optional keys (non-required config fields):
#   MONEYFLOW_OBSERVABILITY.NEW_RELIC.LICENSE_KEY
#   MONEYFLOW_STORAGE.PROVIDER
#   MONEYFLOW_STORAGE.R2.ACCOUNT_ID
#   MONEYFLOW_STORAGE.R2.ACCESS_KEY_ID
#   MONEYFLOW_STORAGE.R2.SECRET_ACCESS_KEY
#   MONEYFLOW_STORAGE.R2.BUCKET_NAME
#   MONEYFLOW_STORAGE.R2.PUBLIC_URL
stringData: {}
