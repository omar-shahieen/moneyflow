apiVersion: apps/v1
kind: Deployment
metadata:
  name: moneyflow-api
  namespace: moneyflow
  labels:
    app.kubernetes.io/name: moneyflow
    app.kubernetes.io/component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: moneyflow
      app.kubernetes.io/component: api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0      # Zero downtime rolling update
  template:
    metadata:
      labels:
        app.kubernetes.io/name: moneyflow
        app.kubernetes.io/component: api
      annotations:
        # Force pod restart when ConfigMap changes
        checksum/config: "placeholder-updated-by-kustomize"
    spec:
      # Allow 60s for graceful shutdown (Asynq + http.Server respect SIGTERM)
      terminationGracePeriodSeconds: 60

      securityContext:
        runAsNonRoot: true
        runAsUser: 65532      # distroless nonroot uid
        runAsGroup: 65532
        fsGroup: 65532

      containers:
        - name: api
          # Image is patched by kustomize overlays with the immutable digest
          image: moneyflow-api:latest
          command: ["/moneyflow-api"]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          envFrom:
            - configMapRef:
                name: moneyflow-config
            - secretRef:
                name: moneyflow-secrets  # created by ExternalSecrets or manually

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

          # Startup: give the app up to 30s to connect to DB and start listening
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 15
            periodSeconds: 2

          # Readiness: only route traffic when health is green
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 0
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          # Liveness: restart the container if it stops responding
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

      # Spread replicas across nodes / zones
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/component: api
