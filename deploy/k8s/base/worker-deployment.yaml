apiVersion: apps/v1
kind: Deployment
metadata:
  name: moneyflow-worker
  namespace: moneyflow
  labels:
    app.kubernetes.io/name: moneyflow
    app.kubernetes.io/component: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: moneyflow
      app.kubernetes.io/component: worker
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: moneyflow
        app.kubernetes.io/component: worker
    spec:
      # Longer grace period: Asynq allows active jobs to finish before shutdown
      terminationGracePeriodSeconds: 120

      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532

      containers:
        - name: worker
          image: moneyflow-api:latest   # same image as API
          command: ["/moneyflow-api"]   # worker (Asynq) is embedded in the API binary

          envFrom:
            - configMapRef:
                name: moneyflow-config
            - secretRef:
                name: moneyflow-secrets

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1000m     # workers can spike CPU during report/CSV generation
              memory: 1Gi

          # The Asynq worker is embedded in the API binary.
          # No HTTP listener — rely on Kubernetes restart policy (restartPolicy: Always)
          # for liveness. distroless has no shell so exec probes are not possible.

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
