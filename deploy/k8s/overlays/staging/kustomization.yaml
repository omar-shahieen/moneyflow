apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: moneyflow-staging

resources:
  - ../../base

# ── Namespace override ────────────────────────────────────────
patches:
  - patch: |-
      apiVersion: v1
      kind: Namespace
      metadata:
        name: moneyflow
      $patch: replace
      apiVersion: v1
      kind: Namespace
      metadata:
        name: moneyflow-staging

  # ── Replica counts (lower for staging) ───────────────────────
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: moneyflow-api
        namespace: moneyflow-staging
      spec:
        replicas: 1
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: moneyflow-frontend
        namespace: moneyflow-staging
      spec:
        replicas: 1

  # ── ConfigMap overrides for staging ──────────────────────────
  # Override DB host, Redis address, CORS, and env-specific settings.
  # MONEYFLOW_DATABASE.PASSWORD and secret keys come from moneyflow-secrets.
  - patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: moneyflow-config
        namespace: moneyflow-staging
      data:
        MONEYFLOW_PRIMARY.ENV: "staging"
        MONEYFLOW_OBSERVABILITY.ENVIRONMENT: "staging"
        MONEYFLOW_SERVER.CORS_ALLOWED_ORIGINS: "https://staging.moneyflow.example.com"
        # ── Database (override to your managed staging DB endpoint) ──
        MONEYFLOW_DATABASE.HOST: "staging-db.moneyflow.example.com"
        MONEYFLOW_DATABASE.PORT: "5432"
        MONEYFLOW_DATABASE.NAME: "moneyflow_staging"
        MONEYFLOW_DATABASE.USER: "moneyflow_staging"
        MONEYFLOW_DATABASE.SSL_MODE: "require"
        MONEYFLOW_DATABASE.MAX_OPEN_CONNS: "10"
        MONEYFLOW_DATABASE.MAX_IDLE_CONNS: "5"
        # ── Redis (override to your managed staging Redis endpoint) ──
        MONEYFLOW_REDIS.ADDRESS: "staging-redis.moneyflow.example.com:6379"
        # ── Observability ─────────────────────────────────────────────
        MONEYFLOW_OBSERVABILITY.LOGGING.LEVEL: "debug"
        MONEYFLOW_OBSERVABILITY.LOGGING.FORMAT: "json"

  # ── Ingress host override ─────────────────────────────────────
  - patch: |-
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: moneyflow
        namespace: moneyflow-staging
        annotations:
          cert-manager.io/cluster-issuer: "letsencrypt-staging"
      spec:
        tls:
          - hosts:
              - staging.moneyflow.example.com
            secretName: moneyflow-staging-tls
        rules:
          - host: staging.moneyflow.example.com
            http:
              paths:
                - path: /api
                  pathType: Prefix
                  backend:
                    service:
                      name: moneyflow-api
                      port:
                        name: http
                - path: /health
                  pathType: Exact
                  backend:
                    service:
                      name: moneyflow-api
                      port:
                        name: http
                - path: /
                  pathType: Prefix
                  backend:
                    service:
                      name: moneyflow-frontend
                      port:
                        name: http

# Image tags are set by the release pipeline via:
#   kustomize edit set image moneyflow-api=<registry>/<image>@sha256:<digest>
